<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CoLearn user flow</title>
  <desc id="desc">Teacher content and student learning loops connected through a configurable tutor agent.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#15233d"/><stop offset="1" stop-color="#1d6f70"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172033" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b778d"/></marker>
    <style>
      .bg{fill:#f5f7fb}.card{fill:#fff;stroke:#e4e9f0;stroke-width:1.5}.dark{fill:url(#hero)}.label{font:700 12px Inter,Arial,sans-serif;fill:#6b778d;letter-spacing:1.4px}.title{font:800 27px Inter,Arial,sans-serif;fill:#172033}.body{font:14px Inter,Arial,sans-serif;fill:#172033}.small{font:12px Inter,Arial,sans-serif;fill:#6b778d}.white{font:700 14px Inter,Arial,sans-serif;fill:#fff}.teal{font:800 12px Inter,Arial,sans-serif;fill:#1e9b8a}.pill{fill:#e5f6f2}.line{stroke:#6b778d;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dash{stroke:#1e9b8a;stroke-width:1.6;fill:none;stroke-dasharray:5 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="60" y="60" class="label">COLEARN · TARGET USER FLOW</text>
  <text x="60" y="101" class="title">Teacher context → adaptive learning → visible progress</text>
  <rect x="60" y="135" width="1080" height="112" rx="20" class="dark" filter="url(#shadow)"/>
  <text x="90" y="174" class="teal" style="fill:#9ce8d8">CORE LOOP</text>
  <text x="90" y="205" class="white">Start or resume a concept session</text>
  <text x="90" y="227" class="small" style="fill:#c8d8e9">The tutor uses teacher-approved context and labeled external sources.</text>
  <rect x="650" y="165" width="205" height="45" rx="12" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".2"/>
  <text x="678" y="193" class="white" style="font-size:13px">Ask · practice · reflect</text>
  <path d="M520 190 C570 190 600 190 650 190" class="line"/>
  <path d="M855 190 C900 190 930 190 980 190" class="line"/>
  <rect x="980" y="165" width="125" height="45" rx="12" fill="#5ee0c4"/>
  <text x="1000" y="193" class="body" style="font-weight:800">Next step</text>

  <text x="60" y="305" class="label">TEACHER LOOP</text>
  <rect x="60" y="330" width="230" height="92" rx="16" class="card" filter="url(#shadow)"/><text x="82" y="360" class="body" style="font-weight:800">Shape context</text><text x="82" y="383" class="small">Concepts · objectives · notes</text>
  <rect x="335" y="330" width="230" height="92" rx="16" class="card" filter="url(#shadow)"/><text x="357" y="360" class="body" style="font-weight:800">Configure tutor</text><text x="357" y="383" class="small">Modes · source policy</text>
  <rect x="610" y="330" width="230" height="92" rx="16" class="card" filter="url(#shadow)"/><text x="632" y="360" class="body" style="font-weight:800">Read signals</text><text x="632" y="383" class="small">Confidence · evidence</text>
  <rect x="885" y="330" width="230" height="92" rx="16" class="card" filter="url(#shadow)"/><text x="907" y="360" class="body" style="font-weight:800">Intervene</text><text x="907" y="383" class="small">Guide the next learning step</text>
  <path d="M290 376 L335 376" class="line"/><path d="M565 376 L610 376" class="line"/><path d="M840 376 L885 376" class="line"/>

  <text x="60" y="485" class="label">STUDENT LOOP</text>
  <rect x="60" y="510" width="205" height="92" rx="16" class="card" filter="url(#shadow)"/><text x="82" y="540" class="body" style="font-weight:800">Choose concept</text><text x="82" y="563" class="small">Resume or begin</text>
  <rect x="300" y="510" width="205" height="92" rx="16" class="card" filter="url(#shadow)"/><text x="322" y="540" class="body" style="font-weight:800">Talk with tutor</text><text x="322" y="563" class="small">Guided · Socratic · hint</text>
  <rect x="540" y="510" width="205" height="92" rx="16" class="card" filter="url(#shadow)"/><text x="562" y="540" class="body" style="font-weight:800">Practice</text><text x="562" y="563" class="small">Try, revise, explain</text>
  <rect x="780" y="510" width="205" height="92" rx="16" class="card" filter="url(#shadow)"/><text x="802" y="540" class="body" style="font-weight:800">Update progress</text><text x="802" y="563" class="small">Confidence · next action</text>
  <rect x="1015" y="510" width="125" height="92" rx="16" class="card" filter="url(#shadow)"/><text x="1036" y="540" class="body" style="font-weight:800">Continue</text><text x="1036" y="563" class="small">Later or now</text>
  <path d="M265 556 L300 556" class="line"/><path d="M505 556 L540 556" class="line"/><path d="M745 556 L780 556" class="line"/><path d="M985 556 L1015 556" class="line"/>
  <path d="M1078 602 C1078 665 180 665 180 602" class="dash"/>
  <text x="560" y="678" class="small">Optional understanding check adds evidence without turning the conversation into an assignment.</text>
</svg>
