<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CoLearn</title>
  <link rel="stylesheet" href="/static/assets/app.css">
  <script src="/static/assets/auth.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="card card-pad auth-card" aria-labelledby="auth-title">
      <a href="/" class="auth-brand"><span class="brand-mark">C</span><span class="brand-name">CoLearn</span></a>
      <p class="eyebrow auth-eyebrow">Welcome back</p>
      <h1 id="auth-title" class="auth-title">Sign in to your workspace</h1>
      <p class="auth-copy">Continue your learning or open your teacher workspace.</p>
      {{if .Error}}<div class="alert alert-error auth-server-error" role="alert">{{.Error}}</div>{{end}}
      <form class="auth-form" action="/api/auth/login" method="post" data-auth-form>
        <div class="auth-field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required placeholder="you@school.edu"></div>
        <div class="auth-field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password" maxlength="72"></div>
        <p class="auth-error" role="status" aria-live="polite" data-auth-error></p>
        <button class="btn btn-primary btn-block" type="submit" data-auth-submit>Sign in</button>
      </form>
      <p class="auth-footer">New to CoLearn? <a href="/signup">Create an account</a></p>
      <a class="auth-home" href="/">← Back to CoLearn</a>
    </section>
  </main>
</body>
</html>
