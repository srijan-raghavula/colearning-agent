{{define "student/page.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submissions · CoLearn</title>
  <link rel="stylesheet" href="/static/assets/app.css">
</head>
<body>
  <div class="shell">
    <main class="page page-narrow">
      <header class="page-heading"><div><div class="eyebrow">Legacy assessment portal</div><h1 class="page-title">Your submissions</h1><p class="page-lede">Signed in as {{.Dashboard.StudentName}}.</p></div><a class="btn btn-secondary" href="/student">Learning dashboard</a></header>
      <section class="card card-pad">
        <h2 class="card-title">Submit an assessment</h2>
        <form class="form-grid mt-16" action="/student/submit" method="post">
          <div class="form-field"><label for="submission-id">Submission ID</label><input class="input" id="submission-id" name="id" required></div>
          <div class="form-field"><label for="subject-id">Subject</label><input class="input" id="subject-id" name="subject_id" required></div>
          <div class="form-field"><label for="topic-id">Topic</label><input class="input" id="topic-id" name="topic_id" required></div>
          <div class="form-field"><label for="title">Title</label><input class="input" id="title" name="title" required></div>
          <div class="form-field"><label for="attachment">Attachment name</label><input class="input" id="attachment" name="attachment"></div>
          <div class="form-field"><label for="due-at">Due at (RFC 3339)</label><input class="input" id="due-at" name="due_at" type="text" placeholder="2026-12-31T23:59:59Z" required></div>
          <div class="form-field full"><button class="btn btn-primary" type="submit">Submit assessment</button></div>
        </form>
      </section>
      <section class="card card-pad mt-24">{{template "student/submissions.html" .}}</section>
    </main>
  </div>
</body>
</html>
{{end}}
